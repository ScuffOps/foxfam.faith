<!-- Minimal architectural highlights: short, top-left-only accents. -->
  <path d="m83 219 86-23m445-110 82 21" fill="none" stroke="#fff8e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
